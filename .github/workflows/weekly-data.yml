# Weekly refresh of the CDC surveillance feeds.
#
# Every Saturday (and on demand from the Actions tab) this job:
#   1. downloads the seven CDC feeds (scripts/refresh_data.py);
#   2. recomputes everything that depends on the data with the saved inputs
#      and settings (scripts/export_run.py): historical limits, scenario
#      episodes and frequencies, emphasis multipliers, the full run, and an
#      update log of what changed since the previous week;
#   3. runs the verification suite on the new data and stops if it fails;
#   4. replaces the content of the `data` branch (a single commit, so the
#      repository does not grow), which the web app reads;
#   5. archives the week as a release asset `data-YYYY-MM-DD` (feeds and the
#      run workbook), so any past week can be reproduced.
# A failed feed keeps the previous week's file; GitHub emails the owner
# when the job fails.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   SOCRATA_APP_TOKEN     optional, raises the CDC rate limit
#   SSDM_SHEET_ID         optional, the Google Sheet holding the expert inputs
#   GCP_SERVICE_ACCOUNT   optional, the service account JSON for that sheet

name: weekly-data

on:
  schedule:
    - cron: "17 13 * * 6"   # Saturdays 13:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SSDM_DATA_DIR: ${{ github.workspace }}/out
      SSDM_REMOTE_DATA: "0"
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
      SSDM_SHEET_ID: ${{ secrets.SSDM_SHEET_ID }}
      gcp_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Previous week's data (for the fallback and the update log)
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth 1 origin data
            git --work-tree=out checkout origin/data -- . || true
            git reset -q
          fi
          ls -la out || true

      - name: Refresh the CDC feeds
        run: python scripts/refresh_data.py

      - name: Recompute the derived quantities and the update log
        run: |
          python scripts/export_run.py --derived out/derived --out out/run.xlsx
          python - <<'PY'
          import hashlib, json, os, pathlib, datetime
          out = pathlib.Path(os.environ["SSDM_DATA_DIR"])
          files = {}
          for p in sorted(out.glob("feeds/*.parquet")):
              files[p.name] = {"sha256": hashlib.sha256(p.read_bytes()).hexdigest(), "bytes": p.stat().st_size}
          for p in sorted(out.glob("derived/*.csv")):
              files[f"derived/{p.name}"] = {"sha256": hashlib.sha256(p.read_bytes()).hexdigest(), "bytes": p.stat().st_size}
          status = json.loads((out / "pipeline_status.json").read_text())
          man = {"generated_utc": datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC"),
                 "code_commit": os.environ.get("GITHUB_SHA", "")[:7],
                 "overall_status": status.get("overall_status"), "files": files}
          (out / "manifest.json").write_text(json.dumps(man, indent=2))
          print(json.dumps(man, indent=2)[:2000])
          PY

      - name: Verify the method on this week's data before publishing
        run: |
          pip install -r requirements-dev.txt
          python -m pytest -q tests -x -p no:warnings

      - name: Publish to the data branch
        run: |
          cd out
          rm -rf .git
          git init -q -b data
          git config user.name "ssdm-data-bot"
          git config user.email "ssdm-data-bot@users.noreply.github.com"
          printf "# SSDM weekly data\n\nGenerated by the weekly-data workflow. Do not edit by hand.\n" > README.md
          git add feeds derived manifest.json pipeline_status.json README.md
          git commit -q -m "Weekly data $(date -u +%Y-%m-%d)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data:data

      - name: Archive the week as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="data-$(date -u +%Y-%m-%d)"
          cd out && zip -qr "../ssdm-data-${TAG#data-}.zip" feeds derived manifest.json pipeline_status.json run.xlsx && cd ..
          gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "ssdm-data-${TAG#data-}.zip" --title "Weekly data ${TAG#data-}" \
            --notes "Feeds, derived quantities and the full run of the week. See derived/update_log.csv for changes." --latest=false
